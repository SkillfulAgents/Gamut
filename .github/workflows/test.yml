name: Tests

on:
  push:
    branches: [main]
  # Every PR, whatever its base: a stacked PR must get the full suite too,
  # not only the one at the bottom of the stack that targets main.
  pull_request:

# A new push to a PR makes the run still going on its previous commit moot, so
# that run is cancelled (about one PR run in five was overtaken this way).
# Pushes to main are grouped by commit, so every commit on main is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Typecheck, lint and the unit tests are separate jobs so they run side by
  # side: back to back in one job they took ~7.5 min. ESLint 8 is
  # single-threaded, so more cores would not speed it up, and the typecheck
  # (TypeScript 7, native) takes seconds; vitest is the one that scales with
  # cores, so it gets the big runner.
  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run typecheck
        run: npm run typecheck

  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run lint
        run: npm run lint

  # The full suite with coverage measured 202s on 8 cores and 75s on 32, so
  # the runner size is the speed-up here. No sharding, which would mean
  # merging coverage across jobs.
  unit-tests:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      # vitest.config.ts switches to CI reporters when GITHUB_ACTIONS is set:
      # dot output, a GitHub annotation per failure, and the JSON report the
      # next step turns into a run-page summary. A red run names the failing
      # tests without expanding this step's log at all.
      - name: Run unit tests with coverage
        run: npx vitest run --coverage

      - name: Unit test summary
        if: always()
        run: npx tsx scripts/summarize-vitest-failures.ts

      - name: Coverage summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

  # The same unit tests against libsql: asynchronous, batch-only, the in-process
  # stand-in for Cloudflare D1. Only the test files marked `// @libsql-must-pass`
  # run here; markers are added as directories are converted to awaited access
  # (SUP-865) and never removed.
  unit-tests-libsql:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run the libsql must-pass tests
        run: npm run test:libsql

  # The same unit tests with every agent actor behind the serializing test
  # transport, as a caller across a wire would reach it (SUP-1253). Every file
  # runs but the few in scripts/actor-transport-exceptions.txt, a list that
  # only shrinks. Nearly the whole suite, so the same big runner as unit-tests:
  # on 8 cores the tests took ~4.3 min, one of the last jobs to finish.
  unit-tests-actor-transport:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Run the unit tests through the actor transport
        run: npm run test:actor-transport

  container-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agent-container/package-lock.json

      # 11.14.1 = newest npm with min-release-age support (needs >=11.10) where
      # `npm ls --json --long` still works (broken in 11.15+, breaks electron-builder)
      - name: Upgrade npm (pinned)
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci
        working-directory: agent-container

      # The SDK's optional deps include both glibc and musl Linux binaries with
      # no libc constraint, so npm installs both on a glibc runner. The SDK's
      # resolver prefers the musl one and then spawn fails with ENOENT (kernel
      # can't load it). Match the Dockerfile workaround.
      - name: Drop musl variant of Claude Code native binary
        run: rm -rf node_modules/@anthropic-ai/claude-agent-sdk-linux-*-musl
        working-directory: agent-container

      - name: Run typecheck
        run: npx tsc --noEmit
        working-directory: agent-container

      - name: Run container tests
        run: npm test
        working-directory: agent-container
        env:
          SDK_TEST_ANTHROPIC_API_KEY: ${{ secrets.SDK_TEST_ANTHROPIC_API_KEY }}

  # Builds the agent container image and drives its browser endpoints. The
  # image is built from agent-container/ alone, so a PR that changes nothing
  # there (about nine in ten) skips the build and the tests; pushes to main
  # always run them. The build starts from the layer cache main's image builds
  # leave in the registry (agent-container-image.yml), which needs no login to
  # read, and only reads it.
  container-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # When the file list cannot be read, the tests run.
      - name: Check whether this PR changes the agent container
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          if ! files=$(gh api --paginate "$FILES" --jq '.[].filename'); then
            echo "container=true" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(agent-container/|\.github/workflows/test\.yml$)' <<< "$files"; then
            echo "container=true" >> "$GITHUB_OUTPUT"
          else
            echo "container=false" >> "$GITHUB_OUTPUT"
            echo "No change under agent-container/: the image build and its tests were skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.container != 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        if: steps.changes.outputs.container != 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./agent-container
          tags: superagent-container
          load: true
          cache-from: type=registry,ref=ghcr.io/skillfulagents/superagent-agent-container-base:buildcache-amd64

      - name: Run browser integration tests
        if: steps.changes.outputs.container != 'false'
        run: ./agent-container/test-browser-integration.sh superagent-container

  # The shared-server Chromium suite, split across runners. Each shard starts
  # its own Vite server and database, so a shard's pages only see its own
  # agents' activity: per-test cost on one shared server rises with the number
  # of concurrent workers, while shards add parallelism without that.
  e2e-tests:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E shard
        env:
          PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/web
          # Four workers measured the same per-test cost and failure count as
          # two on one server; six raised both.
          PLAYWRIGHT_WORKERS: '4'
          # Playwright cuts shards as contiguous runs of tests in file order,
          # and per-test cost is uneven along that order (the streaming specs
          # sort late), so equal counts leave one shard far behind. These are
          # test counts per shard, one per shard, colon-separated, fitted to
          # equalize test time measured in CI; re-fit them when a shard runs
          # well over the others.
          PWTEST_SHARD_WEIGHTS: '100:69:94:89:69'
          PLAYWRIGHT_OUTPUT_DIR: test-results/web
          PLAYWRIGHT_HTML_REPORT: playwright-report/web
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/5

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-artifacts-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Suites that need a server and data dir of their own, in three groups that
  # run side by side, one job each; within a group the suites run back to back
  # on one port. All in one job they took ~7 min, the second-slowest job.
  e2e-isolated-suites:
    name: e2e-isolated-suites (${{ matrix.group }})
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # Each group takes 2-3 min; this bounds a hang.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [wizard-graph, sidebar-radix, mcp]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Wizard E2E suite
        id: wizard_e2e
        if: matrix.group == 'wizard-graph'
        env:
          PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/wizard
          PLAYWRIGHT_OUTPUT_DIR: test-results/wizard
          PLAYWRIGHT_HTML_REPORT: playwright-report/wizard
        run: npm run test:e2e:wizard

      # Own server + fresh data dir: the graph canvas gestures need a board
      # that holds only this spec's agents and a layout no sibling worker is
      # re-solving mid-gesture (the previous shared-server arrangement was the
      # suite's top flake source).
      - name: Run graph E2E suite
        if: ${{ matrix.group == 'wizard-graph' && !cancelled() && (success() || steps.wizard_e2e.outcome == 'failure') }}
        env:
          PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/graph
          PLAYWRIGHT_OUTPUT_DIR: test-results/graph
          PLAYWRIGHT_HTML_REPORT: playwright-report/graph
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:e2e:graph 2>&1 | tee test-results/graph.log

      # Section drag targets must stay still while the pointer crosses them.
      # Other specs creating agents used to move those targets mid-gesture.
      - name: Run sidebar E2E suite
        id: sidebar_e2e
        if: matrix.group == 'sidebar-radix'
        env:
          PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/sidebar
          PLAYWRIGHT_OUTPUT_DIR: test-results/sidebar
          PLAYWRIGHT_HTML_REPORT: playwright-report/sidebar
        run: |
          set -o pipefail
          npm run test:e2e:sidebar 2>&1 | tee /tmp/sidebar-e2e-results.txt

      - name: Run Radix Chromium interaction and touch suites
        if: ${{ matrix.group == 'sidebar-radix' && !cancelled() && (success() || steps.sidebar_e2e.outcome == 'failure') }}
        env:
          E2E_PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/radix-chromium
          PLAYWRIGHT_OUTPUT_DIR: test-results/radix-chromium
          PLAYWRIGHT_HTML_REPORT: playwright-report/radix-chromium
        run: |
          set -o pipefail
          mkdir -p test-results
          E2E_MOCK=true npx playwright test --config=playwright.radix.config.ts --project=radix-chromium --project=radix-chromium-touch --retries=0 2>&1 | tee test-results/radix-chromium.log

      # The MCP server (/mcp) on its own server and data dir: the suite switches
      # the endpoint off and regenerates its token mid-run. Besides the SDK
      # clients it runs the pinned MCP conformance suite and real Claude Code and
      # Codex binaries (pinned below) against a stub model: no account, no secret,
      # no model call.
      - name: Install pinned agent CLIs for the MCP suite
        if: ${{ matrix.group == 'mcp' && !cancelled() }}
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/agent-clis" @anthropic-ai/claude-code@2.1.325 @openai/codex@0.167.0

      - name: Run MCP server E2E suite
        if: ${{ matrix.group == 'mcp' && !cancelled() }}
        env:
          PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/mcp
          PLAYWRIGHT_OUTPUT_DIR: test-results/mcp
          PLAYWRIGHT_HTML_REPORT: playwright-report/mcp
          # A missing CLI fails the suite here instead of skipping its tests.
          MCP_HARNESS_REQUIRED: '1'
        run: |
          set -o pipefail
          mkdir -p test-results
          export CLAUDE_BIN="$RUNNER_TEMP/agent-clis/node_modules/.bin/claude"
          export CODEX_BIN="$RUNNER_TEMP/agent-clis/node_modules/.bin/codex"
          npm run test:e2e:mcp 2>&1 | tee test-results/mcp.log

      # The MCP server in auth mode, its own server and data dir: the SDKs'
      # OAuth sign-in through Chromium (DCR and a Client ID Metadata Document),
      # consent, refresh, disconnect, step-up and roles; the conformance suites
      # with a real access token; and the same pinned Claude Code and Codex
      # signing in by OAuth. Both CLIs register with metadata documents on
      # claude.ai and chatgpt.com, which the server under test fetches.
      - name: Run MCP OAuth E2E suite
        if: ${{ matrix.group == 'mcp' && !cancelled() }}
        env:
          PORT: '3015'
          MCP_OAUTH_CIMD_PORT: '3016'
          SUPERAGENT_DATA_DIR: .e2e-data/mcp-oauth
          PLAYWRIGHT_OUTPUT_DIR: test-results/mcp-oauth
          PLAYWRIGHT_HTML_REPORT: playwright-report/mcp-oauth
          MCP_HARNESS_REQUIRED: '1'
        run: |
          set -o pipefail
          mkdir -p test-results
          export CLAUDE_BIN="$RUNNER_TEMP/agent-clis/node_modules/.bin/claude"
          export CODEX_BIN="$RUNNER_TEMP/agent-clis/node_modules/.bin/codex"
          npm run test:e2e:mcp-oauth 2>&1 | tee test-results/mcp-oauth.log

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-artifacts-isolated-${{ matrix.group }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # WebKit-engine regression suite on real macOS. Safari-class scroll and
  # compositing bugs never reproduce in Chromium — and macOS WebKit runs on
  # Apple's compositor, which is where the async-scroll rollbacks that kill
  # live-edge following actually live. Starts with the follow regression
  # (safari-follow.spec.ts); add future Safari-compatibility cases to the
  # web-webkit Playwright project. Repeats because this bug class is
  # probabilistic per run (~50% pre-fix): three repeats with retries off
  # catch a regression with ~88% confidence per push. (Retries stay off —
  # each retry would give a probabilistic failure another chance to pass.)
  # The three repeats run on three Macs at once, one pass of the suite each;
  # run back to back on one Mac they took ~6 min. The WebKit suites that need
  # only one pass run in e2e-webkit-macos-suites below.
  # WebKit traces record no screenshots (webkitTrace in the Playwright configs),
  # and no --trace flag here, which would override that and turn them back on:
  # every trace screenshot holds a WindowServer surface until the screen redraws,
  # and on these VMs that filled up mid-suite and took the runner down.
  e2e-webkit-macos:
    runs-on: blacksmith-6vcpu-macos-latest
    strategy:
      # A failed repeat must not cancel the others: how many of the three
      # failed is what tells a regression from a one-off.
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    name: e2e-webkit-macos (repeat ${{ matrix.repeat }}/3)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Install Playwright WebKit
        run: npx playwright install webkit

      - name: Enable keyboard navigation for Playwright WebKit
        # macOS otherwise skips buttons on plain Tab. Enable Keyboard Navigation
        # for this test app only, preserving native Tab and Radix's focus-loop
        # assertions (FocusScope deliberately ignores Option+Tab).
        # https://github.com/microsoft/playwright/issues/41808
        run: |
          defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
          defaults read org.webkit.Playwright AppleKeyboardUIMode

      - name: Run WebKit regression suite
        env:
          PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/webkit
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit
          PLAYWRIGHT_HTML_REPORT: playwright-report/webkit
          # Serial: timing-sensitive scroll tests must not share the box with
          # each other.
          PLAYWRIGHT_WORKERS: '1'
        run: |
          set -o pipefail
          mkdir -p test-results
          E2E_MOCK=true npx playwright test --project=web-webkit --retries=0 2>&1 | tee test-results/webkit.log

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-artifacts-${{ matrix.repeat }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The WebKit suites that need one pass: the navigation contracts, and the
  # same real app controls the Chromium jobs drive (Radix, graph, auth forms),
  # with their touch projects. They used to run after the regression suite in
  # repeat 1, which made it twice as long as the other repeats and the last
  # job to finish on most runs. Two Macs: the navigation contracts (~2 min)
  # on one, the interaction suites (~2.5 min) on the other. Same trace rule as
  # above: no --trace flag.
  e2e-webkit-macos-suites:
    runs-on: blacksmith-6vcpu-macos-latest
    strategy:
      fail-fast: false
      matrix:
        group: [navigation, interactions]
    name: e2e-webkit-macos (${{ matrix.group }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Install Playwright WebKit
        run: npx playwright install webkit

      - name: Enable keyboard navigation for Playwright WebKit
        id: webkit_setup
        # See e2e-webkit-macos.
        run: |
          defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
          defaults read org.webkit.Playwright AppleKeyboardUIMode

      - name: Run WebKit navigation contracts
        if: matrix.group == 'navigation'
        env:
          E2E_PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/webkit-navigation
          PLAYWRIGHT_OUTPUT_DIR: test-results/webkit-navigation
          PLAYWRIGHT_HTML_REPORT: playwright-report/webkit-navigation
          PLAYWRIGHT_WORKERS: '1'
        run: |
          set -o pipefail
          mkdir -p test-results
          E2E_MOCK=true npx playwright test --project=web-webkit-navigation --retries=0 2>&1 | tee test-results/webkit-navigation.log

      - name: Run Radix WebKit interaction and touch suites
        if: matrix.group == 'interactions'
        env:
          E2E_PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/radix-webkit
          PLAYWRIGHT_OUTPUT_DIR: test-results/radix-webkit
          PLAYWRIGHT_HTML_REPORT: playwright-report/radix-webkit
        run: |
          set -o pipefail
          mkdir -p test-results
          E2E_MOCK=true npx playwright test --config=playwright.radix.config.ts --project=radix-webkit --project=radix-webkit-touch --retries=0 2>&1 | tee test-results/radix-webkit.log

      - name: Run graph WebKit interaction and touch suites
        if: ${{ matrix.group == 'interactions' && !cancelled() && steps.webkit_setup.outcome == 'success' }}
        env:
          E2E_PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/graph-webkit
          PLAYWRIGHT_OUTPUT_DIR: test-results/graph-webkit
          PLAYWRIGHT_HTML_REPORT: playwright-report/graph-webkit
        run: |
          set -o pipefail
          mkdir -p test-results
          E2E_MOCK=true npx playwright test --config=playwright.graph.config.ts --project=graph-webkit --project=graph-webkit-touch 2>&1 | tee test-results/graph-webkit.log

      - name: Run auth forms on WebKit and touch
        if: ${{ matrix.group == 'interactions' && !cancelled() && steps.webkit_setup.outcome == 'success' }}
        env:
          E2E_PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/forms-webkit
          PLAYWRIGHT_OUTPUT_DIR: test-results/forms-webkit
          PLAYWRIGHT_HTML_REPORT: playwright-report/forms-webkit
        run: |
          set -o pipefail
          mkdir -p test-results
          E2E_MOCK=true npx playwright test --config=playwright.forms.config.ts --project=forms-webkit --project=forms-webkit-touch 2>&1 | tee test-results/forms-webkit.log

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-artifacts-${{ matrix.group }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The auth suite boots eleven dev servers (API + Vite each) up front, side by
  # side (e2e/auth/serve-all.mjs). On a 4-core, 16 GB GitHub runner that got the
  # runner shut down or lost mid-boot in about four jobs in ten, and a lost
  # runner hung the job for ~50 min before it failed. Same box as e2e-tests;
  # the timeout bounds a hang.
  e2e-auth-tests:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Install Playwright browsers
        id: auth_browser_setup
        run: npx playwright install --with-deps chromium

      # Six workers: each project has a server of its own (auth-collaboration,
      # nine files on one server, stays at two), so the floor is the longest
      # file, auth-flow.spec.ts (~1 min of tests that run in order). On two
      # workers the tests took ~2.7 min.
      - name: Run Auth E2E tests
        env:
          PORT: '3001'
          SUPERAGENT_DATA_DIR: .e2e-data/auth
          PLAYWRIGHT_WORKERS: '6'
          PLAYWRIGHT_OUTPUT_DIR: test-results/auth
          PLAYWRIGHT_HTML_REPORT: playwright-report/auth
        run: npm run test:e2e:auth

      # A separate server/database lets these scenarios change password policy
      # without affecting the existing auth projects. Run even if that suite fails.
      - name: Run auth forms on Chromium and touch
        if: ${{ !cancelled() && steps.auth_browser_setup.outcome == 'success' }}
        env:
          E2E_PORT: '3001'
          SUPERAGENT_DATA_DIR: .e2e-data/forms-chromium
          PLAYWRIGHT_OUTPUT_DIR: test-results/forms-chromium
          PLAYWRIGHT_HTML_REPORT: playwright-report/forms-chromium
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:e2e:forms 2>&1 | tee test-results/forms-chromium.log

      - name: Upload auth Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-auth-playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The built desktop app, driven by its live harnesses (e2e/live/*/run.ts) in
  # three groups side by side. Each job builds the app itself; every harness
  # keeps its own scratch app state and only reads dist/. Back to back after
  # one build on a 4-core GitHub runner they made this the last job to finish
  # (~5.5 min). A failed harness must not skip the others in its group; a
  # failed build or cancelled job skips all of them.
  #
  # The cloud group drives the real Electron app over CDP against a real
  # auth-mode deployment, with only the platform's discovery + grant minting
  # stubbed. It is the only job in which a renderer ever resolves a cloud
  # target, so it is the only one that can fail on cloud mode being broken —
  # see e2e/live/cloud-electron/. It also checks the runtime dependency
  # closure, which needs both builds it already makes.
  e2e-electron:
    name: e2e-electron (${{ matrix.group }})
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        group: [navigation, interactions, cloud]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      # Only for the shared libraries Electron needs on a bare runner, and
      # xvfb; this job drives Electron over CDP and never launches a Playwright
      # browser.
      - name: Install Electron's system dependencies
        run: npx playwright install-deps chromium

      # Electron no longer downloads its binary on install, only on first launch.
      # The chown below needs dist/ on disk before anything has launched it.
      - name: Download the Electron binary
        run: npx --no install-electron

      # The download leaves chrome-sandbox owned by the runner user, and Chromium
      # aborts on startup rather than run unsandboxed — SIGTRAP before the app
      # exists, which reaches the harness only as "the API server never bound".
      # Fixed here rather than with --no-sandbox because this suite exists to
      # drive the real desktop app, and it should not be the one running it in a
      # weaker configuration than anybody's actual machine.
      - name: Let Electron use its sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # The deployment the cloud and forms harnesses run against. NOT
      # `build:web` — that is `vite build`, whose outDir is dist/renderer, the
      # same directory the desktop renderer lives in. The deployment is used
      # purely as an API here, so only the server bundle is needed.
      - name: Build the deployment server bundle
        if: matrix.group == 'cloud'
        run: npm run build:api

      - name: Build the desktop app
        id: desktop_build
        run: npm run build:electron

      # Every bare import in the emitted bundles is reachable from the
      # production dependency closure, and no direct production dependency goes
      # unused. The packaging workflows (build-mac/build-win) run the electron
      # half again via dist:mac/dist:win; this is what gates PRs, since none of
      # the packaging workflows run there.
      - name: Check runtime dependency closure
        if: matrix.group == 'cloud'
        run: npm run check:runtime-deps

      - name: Validate built Electron navigation and unsaved drafts
        if: ${{ matrix.group == 'navigation' && !cancelled() && steps.desktop_build.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p test-results
          E2E_MOCK=true xvfb-run --auto-servernum npx tsx e2e/live/router/run.ts 2>&1 | tee test-results/electron-router.log

      - name: Upload Electron navigation artifacts
        if: ${{ always() && matrix.group == 'navigation' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-electron-router-artifacts
          path: |
            test-results/electron-router/
            test-results/electron-router.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate built Electron Radix interactions
        if: ${{ matrix.group == 'interactions' && !cancelled() && steps.desktop_build.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p test-results
          E2E_MOCK=true xvfb-run --auto-servernum npx tsx e2e/live/radix/run.ts 2>&1 | tee test-results/electron-radix.log

      - name: Upload Electron interaction artifacts
        if: ${{ always() && matrix.group == 'interactions' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-electron-radix-artifacts
          path: |
            test-results/electron-radix/
            test-results/electron-radix.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate built Electron graph interactions
        if: ${{ matrix.group == 'interactions' && !cancelled() && steps.desktop_build.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p test-results
          E2E_MOCK=true xvfb-run --auto-servernum npx tsx e2e/live/graph/run.ts 2>&1 | tee test-results/electron-graph.log

      - name: Upload Electron graph artifacts
        if: ${{ always() && matrix.group == 'interactions' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-electron-graph-artifacts
          path: |
            test-results/electron-graph/
            test-results/electron-graph.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate packaged PDF rendering and local worker
        if: ${{ matrix.group == 'cloud' && !cancelled() && steps.desktop_build.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p test-results
          xvfb-run --auto-servernum npx tsx e2e/live/pdf-preview/run.ts 2>&1 | tee test-results/electron-pdf.log

      - name: Upload Electron PDF artifacts
        if: ${{ always() && matrix.group == 'cloud' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-electron-pdf-artifacts
          path: |
            test-results/electron-pdf/
            test-results/electron-pdf.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run the cloud-workspace app suite
        if: ${{ matrix.group == 'cloud' && !cancelled() && steps.desktop_build.outcome == 'success' }}
        run: xvfb-run --auto-servernum node e2e/live/cloud-electron/ci.mjs

      - name: Validate built Electron cloud profile forms
        if: ${{ matrix.group == 'cloud' && !cancelled() && steps.desktop_build.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p test-results
          E2E_MOCK=true xvfb-run --auto-servernum npx tsx e2e/live/forms/run.ts 2>&1 | tee test-results/electron-forms.log

      - name: Upload Electron form artifacts
        if: ${{ always() && matrix.group == 'cloud' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-electron-forms-artifacts
          path: |
            test-results/electron-forms/
            test-results/electron-forms.log
          if-no-files-found: ignore
          retention-days: 7

  e2e-a11y-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run a11y audit
        continue-on-error: true
        env:
          PORT: '3000'
          SUPERAGENT_DATA_DIR: .e2e-data/a11y
          PLAYWRIGHT_WORKERS: '1'
          PLAYWRIGHT_OUTPUT_DIR: test-results/a11y
          PLAYWRIGHT_HTML_REPORT: playwright-report/a11y
        run: npm run test:e2e:a11y

      - name: Upload a11y Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-a11y-playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
